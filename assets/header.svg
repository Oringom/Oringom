<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1124"/>
      <stop offset="0.65" stop-color="#1c2147"/>
      <stop offset="1" stop-color="#2b2a52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#c8102e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c8102e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2e8d5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f2e8d5" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#f2e8d5" stop-opacity="0"/>
    </linearGradient>
    <path id="petal" d="M0,-7 C5,-9 8,-2 5,3 C3,6 1,7 0,8 C-1,7 -3,6 -5,3 C-8,-2 -5,-9 0,-7 Z"/>
    <style>
      .jp { font-family: 'Noto Serif JP','Yu Mincho','YuMincho','Hiragino Mincho ProN','MS Mincho',serif; }
      .tw { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
      .sun { animation: breathe 6s ease-in-out infinite; transform-origin: 770px 135px; }
      @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.04) } }
      .fade { animation: fade 2.4s ease-out both; }
      .fade2 { animation: fade 2.4s ease-out .6s both; }
      .fade3 { animation: fade 2.4s ease-out 1.2s both; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    </style>
  </defs>

  <rect width="1000" height="340" rx="14" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f2e8d5">
    <circle class="tw" cx="60" cy="40" r="1.4"/>
    <circle class="tw" cx="190" cy="25" r="1" style="animation-delay:.8s"/>
    <circle class="tw" cx="330" cy="60" r="1.2" style="animation-delay:1.6s"/>
    <circle class="tw" cx="455" cy="30" r="1" style="animation-delay:.4s"/>
    <circle class="tw" cx="590" cy="55" r="1.3" style="animation-delay:2.2s"/>
    <circle class="tw" cx="925" cy="40" r="1.1" style="animation-delay:1.2s"/>
    <circle class="tw" cx="960" cy="110" r="1" style="animation-delay:2.6s"/>
    <circle class="tw" cx="640" cy="20" r="0.9" style="animation-delay:1.9s"/>
  </g>

  <!-- red sun -->
  <circle cx="770" cy="135" r="150" fill="url(#glow)"/>
  <circle class="sun" cx="770" cy="135" r="88" fill="#c8102e"/>

  <!-- mist -->
  <rect x="-400" y="150" width="900" height="26" fill="url(#mist)">
    <animateTransform attributeName="transform" type="translate" values="0 0;700 0;0 0" dur="38s" repeatCount="indefinite"/>
  </rect>

  <!-- Mt. Fuji -->
  <path d="M430,340 L640,175 Q660,160 680,163 L700,160 Q720,158 735,172 L960,340 Z" fill="#141831"/>
  <path d="M640,175 Q660,160 680,163 L700,160 Q720,158 735,172 L760,192 L742,186 L728,198 L712,184 L696,197 L680,185 L664,199 L650,186 L622,190 Z" fill="#f2e8d5" opacity="0.92"/>
  <!-- far hills -->
  <path d="M0,340 L0,270 Q120,230 250,262 Q360,290 470,255 Q560,228 640,262 Q760,305 1000,262 L1000,340 Z" fill="#0f132a"/>

  <!-- mist low -->
  <rect x="300" y="268" width="900" height="30" fill="url(#mist)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-600 0;0 0" dur="46s" repeatCount="indefinite"/>
  </rect>

  <!-- torii -->
  <g transform="translate(895,232) scale(0.9)" fill="#c8102e">
    <path d="M-48,0 Q0,-10 48,0 L50,8 Q0,-1 -50,8 Z"/>
    <rect x="-40" y="14" width="80" height="6"/>
    <rect x="-30" y="6" width="7" height="70"/>
    <rect x="23" y="6" width="7" height="70"/>
    <rect x="-3" y="8" width="6" height="8"/>
  </g>

  <!-- vertical greeting -->
  <g class="jp fade3" fill="#c9a86a" font-size="20" text-anchor="middle" letter-spacing="2">
    <text x="58" y="96">よ</text>
    <text x="58" y="122">う</text>
    <text x="58" y="148">こ</text>
    <text x="58" y="174">そ</text>
  </g>
  <line x1="84" y1="80" x2="84" y2="190" stroke="#c9a86a" stroke-opacity="0.4"/>

  <!-- name -->
  <g class="jp">
    <text class="fade" x="112" y="148" fill="#f2e8d5" font-size="64" font-weight="600" letter-spacing="14">ORINGOM</text>
    <text class="fade2" x="116" y="190" fill="#c9a86a" font-size="19" letter-spacing="6">旅人 ・ traveler ・ developer</text>
  </g>

  <!-- hanko seal -->
  <g class="fade2"><g transform="translate(545,98) rotate(-6)">
    <rect x="0" y="0" width="46" height="46" rx="6" fill="none" stroke="#c8102e" stroke-width="3"/>
    <text class="jp" x="23" y="33" text-anchor="middle" font-size="28" font-weight="700" fill="#c8102e">旅</text>
  </g></g>

  <!-- falling sakura -->
  <g fill="#f4b6c2">
    <g><use href="#petal" opacity="0.9"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="5s" repeatCount="indefinite"/></use>
      <animateTransform attributeName="transform" type="translate" values="240 -20;180 360" dur="11s" repeatCount="indefinite"/></g>
    <g><use href="#petal" opacity="0.7" transform="scale(.8)"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="4s" repeatCount="indefinite"/></use>
      <animateTransform attributeName="transform" type="translate" values="420 -20;350 360" dur="14s" begin="2s" repeatCount="indefinite"/></g>
    <g><use href="#petal" opacity="0.85"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/></use>
      <animateTransform attributeName="transform" type="translate" values="610 -20;540 360" dur="12s" begin="4s" repeatCount="indefinite"/></g>
    <g><use href="#petal" opacity="0.6"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="5s" repeatCount="indefinite"/></use>
      <animateTransform attributeName="transform" type="translate" values="860 -20;800 360" dur="13s" begin="1s" repeatCount="indefinite"/></g>
    <g><use href="#petal" opacity="0.8"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="7s" repeatCount="indefinite"/></use>
      <animateTransform attributeName="transform" type="translate" values="90 -20;40 360" dur="15s" begin="6s" repeatCount="indefinite"/></g>
    <g><use href="#petal" opacity="0.75"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="4.5s" repeatCount="indefinite"/></use>
      <animateTransform attributeName="transform" type="translate" values="700 -20;640 360" dur="10s" begin="7s" repeatCount="indefinite"/></g>
  </g>
</svg>
